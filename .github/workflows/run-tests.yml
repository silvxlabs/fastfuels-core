name: Run Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install package with test dependencies
      run: uv sync --extra test

    - name: Run pytest
      run: uv run --extra test pytest -q
